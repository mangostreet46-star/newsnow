services:
  newsnow:
    build: .
    image: newsnow:local
    container_name: newsnow
    restart: unless-stopped
    ports:
      - '5555:4444'
    volumes:
      - newsnow_data:/usr/app/.data
    environment:
      - HOST=0.0.0.0
      - PORT=4444
      - NODE_ENV=production
      - G_CLIENT_ID=Ov23liunrTFBcRMVblyp
      - G_CLIENT_SECRET=cfb311c99602801fce73241395b131764285f5d8
      - JWT_SECRET=2b958350704db0a3e543c2a2b2d29e222f5055a23f8479ef367e70cab3e3a959
      - INIT_TABLE=true
      - ENABLE_CACHE=true
      - PRODUCTHUNT_API_TOKEN=
      - TRANSLATE_PROVIDER=libretranslate
      - TRANSLATE_API_KEY=
      - TRANSLATE_API_URL=http://libretranslate:5000/translate
      - TRANSLATE_SOURCE=en
      - TRANSLATE_TARGET=zh
      - TRANSLATE_CONCURRENCY=8
      - TRANSLATE_TIMEOUT=30000
      - TRANSLATE_MODEL=gpt-4o-mini
    depends_on:
      - libretranslate

  libretranslate:
    image: libretranslate/libretranslate:latest
    container_name: libretranslate
    restart: unless-stopped
    volumes:
      - libretranslate_data:/home/libretranslate/.local
    environment:
      - LT_LOAD_ONLY=en,zh,ja,ko
      - LT_UPDATE_MODELS=true

volumes:
  newsnow_data:
    name: newsnow_data
  libretranslate_data:
    name: libretranslate_data
